services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Troque pela URL do túnel (Cloudflare/ngrok) e reinicie o n8n
      WEBHOOK_URL: https://strode-underrate-magnolia.ngrok-free.dev
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    extra_hosts:
      # No n8n, chame o Spring em http://host.docker.internal:8080
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  n8n_data: